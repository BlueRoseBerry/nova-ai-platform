version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nova_ai
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: true
    volumes:
      - milvus_data:/var/lib/milvus

  nacos:
    image: nacos/nacos-server:v2.4.0
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"

  rocketmq:
    image: apache/rocketmq:5.3.0
    ports:
      - "8080:8080"
      - "9876:9876"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  pg_data:
  milvus_data:
