apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-ai-service
  labels:
    app: nova-ai-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova-ai-service
  template:
    metadata:
      labels:
        app: nova-ai-service
    spec:
      containers:
      - name: app
        image: registry.example.com/nova-ai-service:latest
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: JAVA_OPTS
          value: "-XX:+UseZGC -Xms512m -Xmx2g --enable-preview -Dspring.threads.virtual.enabled=true"
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/nova_ai"
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-ai-gateway
  labels:
    app: nova-ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova-ai-gateway
  template:
    metadata:
      labels:
        app: nova-ai-gateway
    spec:
      containers:
      - name: app
        image: registry.example.com/nova-ai-gateway:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        env:
        - name: JAVA_OPTS
          value: "-XX:+UseZGC -Xms256m -Xmx1g --enable-preview"
