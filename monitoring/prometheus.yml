global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nova-ai-services'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['nova-ai-service:8081', 'nova-ai-gateway:8080', 'nova-ai-agent:8082', 'nova-ai-workflow:8083', 'nova-ai-model-gateway:8084', 'nova-ai-rag:8085', 'nova-ai-skill:8086']
