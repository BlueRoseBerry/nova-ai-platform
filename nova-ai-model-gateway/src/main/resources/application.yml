spring:
  application:
    name: nova-ai-model-gateway
  threads:
    virtual:
      enabled: true

server:
  port: 8084

nova:
  model:
    providers:
      openai:
        api-key: ${OPENAI_API_KEY:sk-demo}
        base-url: https://api.openai.com/v1
      anthropic:
        api-key: ${ANTHROPIC_API_KEY:sk-demo}
        base-url: https://api.anthropic.com
      tongyi:
        api-key: ${TONGYI_API_KEY:sk-demo}
        base-url: https://dashscope.aliyuncs.com
